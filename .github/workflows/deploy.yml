name: CI/CD Pipeline - Test, Build & Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. BACKEND TEST SUITE
  # ==========================================
  backend-test:
    name: Backend Pytest & Schema Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: sqlite:///./test_ci.db
          JWT_SECRET: ci-cd-temporary-secret-key-for-testing-12345
          CORS_ORIGINS: http://localhost:5173,http://localhost:3000
        run: |
          python -m pytest -v

  # ==========================================
  # 2. FRONTEND BUILD & TYPE CHECK
  # ==========================================
  frontend-build:
    name: Frontend Build & TypeScript Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Production Assets
        run: npm run build

      - name: Upload Build Artifact for Deployment
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ==========================================
  # 3. DUAL-MODE GITHUB PAGES DEPLOYMENT
  # ==========================================
  deploy-github-pages:
    name: Deploy Interactive App to GitHub Pages
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./dist

      # Mode A: Automated gh-pages branch deployment (Zero-config, works with default GitHub settings)
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      # Mode B: GitHub Actions artifact deployment (Fallback for repos with Pages set to Actions)
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
        continue-on-error: true

      - name: Deploy via GitHub Pages Actions
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
